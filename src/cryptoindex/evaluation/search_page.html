<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search QA</title>
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  :root { --fg: #1b1f24; --muted: #5b6470; --bg: #fff; --line: #d8dde3; --accent: #2458c6; --soft: #f3f5f8; --hit: #fff4d6; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e6e8eb; --muted: #9aa3ad; --bg: #15181c; --line: #2c3238; --accent: #7aa5ff; --soft: #1d2126; --hit: #3a3220; }
  }
  * { box-sizing: border-box; }
  body { font: 15px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: .6rem 1rem; display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; z-index: 1; }
  header .title { font-weight: 600; }
  #q { flex: 1; min-width: 16rem; font: inherit; padding: .4rem .6rem; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); }
  button { font: inherit; padding: .35rem .9rem; border: 1px solid var(--accent); border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; }
  label { display: flex; gap: .3rem; align-items: center; }
  .muted { color: var(--muted); }
  main { max-width: 60rem; margin: 0 auto; padding: 1rem; }
  .hit { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 1rem; }
  .hit > .head { padding: .5rem .8rem; background: var(--soft); border-bottom: 1px solid var(--line); display: flex; gap: .8rem; flex-wrap: wrap; align-items: baseline; }
  .hit .rank { font-weight: 600; }
  .chan { font-size: .8rem; padding: .05rem .4rem; border: 1px solid var(--line); border-radius: 3px; }
  .kind { font-size: .8rem; padding: .05rem .4rem; border: 1px solid var(--accent); border-radius: 3px; background: none; color: var(--accent); cursor: pointer; }
  #filters { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; width: 100%; }
  #filters .on { background: var(--accent); color: #fff; }
  .gloss { padding: .5rem .8rem; font-style: italic; border-bottom: 1px solid var(--line); }
  .paras { padding: .2rem .8rem .6rem; }
  .para { border-left: 3px solid var(--line); padding-left: .6rem; margin: .5rem 0; }
  .para.matched { border-left-color: var(--accent); background: var(--hit); }
  .para .where { color: var(--muted); font-size: .75rem; }
  .lines p { font-family: ui-monospace, monospace; font-size: .9rem; }
  .empty { padding: 2rem; text-align: center; }
</style>
</head>
<body>
<header>
  <span class="title">Search QA</span>
  <span id="model" class="muted" title="Fixed for the run by CI_SEARCH_VECTORS (D27)"></span>
  <input id="q" type="search" placeholder="Ask a question, name a result, or type notation" autofocus>
  <label title="Search the glosses and questions the model wrote at ingestion time"><input id="generated" type="checkbox" checked> gloss and question channels</label>
  <button id="go">Search</button>
  <div id="filters" class="muted"></div>
</header>
<main id="main"><p class="empty muted">Results show the unit each match belongs to. Highlighted paragraphs are the ones a paragraph channel matched; the gloss is shown for context only and is never cited.</p></main>
<script src="katex/katex.min.js"></script>
<script>
// Clicking a kind keeps only that kind. References are excluded until asked
// for, and asking for the kind has to ask for them too: the server drops an
// excluded kind even when a filter names it.
let only = new Set();      // kinds to keep, empty = all
let withRefs = false;
function element(tag, props = {}, children = []) {
  const el = Object.assign(document.createElement(tag), props);
  el.append(...children);
  return el;
}

function renderMath(root) {
  for (const el of root.querySelectorAll(".math")) {
    katex.render(el.textContent, el, { displayMode: el.classList.contains("block"), throwOnError: false });
  }
}

function kindChip(kind, active, onclick) {
  const b = element("button", { className: "kind" + (active ? " on" : ""), textContent: kind });
  b.onclick = onclick;
  return b;
}

function showFilters(hits) {
  const seen = [...new Set(hits.flatMap((h) => h.kinds))].sort();
  const chips = seen.map((k) => kindChip(k, only.has(k), () => {
    only.has(k) ? only.delete(k) : only.add(k);
    run();
  }));
  const refs = kindChip(withRefs ? "references included" : "references excluded", withRefs, () => {
    withRefs = !withRefs;
    run();
  });
  const clear = only.size ? [kindChip("clear filter", false, () => { only.clear(); run(); })] : [];
  document.getElementById("filters").replaceChildren(
    element("span", { textContent: "kinds:" }), ...chips, ...clear, refs);
}

function hitCard(hit, n) {
  const where = hit.anchor_label ?? `¶${hit.first_pos}–${hit.last_pos}`;
  const badges = Object.entries(hit.channels).sort((a, b) => a[1] - b[1])
    .map(([c, r]) => element("span", { className: "chan", textContent: `${c} #${r}` }));
  const paras = hit.paragraphs.map((p) => {
    const body = element("div");
    body.innerHTML = p.html;  // search_page.paragraph_html: Markdown (raw HTML escaped) with math, or the parser's table HTML
    const label = [`¶${p.position}`, `page ${p.page + 1}`, p.kind, p.label].filter(Boolean).join(" · ");
    return element("div", { className: "para" + (p.matched ? " matched" : "") }, [element("div", { className: "where", textContent: label }), body]);
  });
  return element("div", { className: "hit" }, [
    element("div", { className: "head" }, [
      element("span", { className: "rank", textContent: `${n}.` }),
      element("span", { textContent: `${hit.name} (v${hit.revision}) · ${where}` }),
      element("span", { className: "muted", textContent: `score ${hit.score.toFixed(4)}` }),
      ...badges,
    ]),
    element("div", { className: "gloss", textContent: hit.gloss }),
    element("div", { className: "paras" }, paras),
  ]);
}

async function run() {
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const generated = document.getElementById("generated").checked;
  const main = document.getElementById("main");
  main.replaceChildren(element("p", { className: "empty muted", textContent: "searching…" }));
  try {
    const params = new URLSearchParams({ q, generated });
    for (const k of only) params.append("kinds", k);
    if (withRefs || only.has("reference")) params.set("references", "true");
    const response = await fetch(`api/search?${params}`);
    if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
    const hits = await response.json();
    showFilters(hits);
    main.replaceChildren(...(hits.length ? hits.map((h, i) => hitCard(h, i + 1)) : [element("p", { className: "empty muted", textContent: "No results." })]));
    renderMath(main);
  } catch (err) {
    main.replaceChildren(element("p", { className: "empty", textContent: `Search failed: ${err.message}` }));
  }
}

fetch("api/info").then((r) => r.json()).then((i) => {
  document.getElementById("model").textContent = `${i.model} (${i.vectors} vectors)`;
}).catch(() => {});

document.getElementById("go").onclick = run;
document.getElementById("q").addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });
document.getElementById("generated").onchange = run;
</script>
</body>
</html>
