<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parser review</title>
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  :root { --fg: #1b1f24; --muted: #5b6470; --bg: #fff; --line: #d8dde3; --accent: #2458c6; --ok: #1e7b3a; --bad: #b3261e; --warn: #fff4d6; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e6e8eb; --muted: #9aa3ad; --bg: #15181c; --line: #2c3238; --accent: #7aa5ff; --ok: #6fd08c; --bad: #ff8a80; --warn: #3a3220; }
  }
  * { box-sizing: border-box; }
  body { font: 14px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; height: 100vh; display: flex; flex-direction: column; }
  header { border-bottom: 1px solid var(--line); padding: .5rem 1rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  header .title { font-weight: 600; }
  .muted { color: var(--muted); }
  #saved { font-size: .85rem; }
  #saved.ok { color: var(--ok); } #saved.bad { color: var(--bad); }
  button { font: inherit; padding: .3rem .8rem; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); cursor: pointer; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; padding: 1rem; min-height: 0; }
  .pane { display: flex; flex-direction: column; min-height: 0; }
  .pane h3 { font-size: .95rem; margin: 0 0 .4rem; }
  .scroll { flex: 1; overflow: auto; border: 1px solid var(--line); padding: .5rem; min-height: 0; }
  .scroll img { width: 100%; display: block; }
  .block { border-left: 3px solid var(--line); padding-left: .5rem; margin: .4rem 0; }
  .kind { color: var(--muted); font-size: .75rem; text-transform: uppercase; }
  pre { white-space: pre-wrap; margin: 0; }
  .score { display: flex; gap: .4rem; align-items: center; margin-top: .5rem; }
  /* One line at rest; grows when focused, taking height from the parser output
     above it (the pane is a flex column), and scrolls when the note is longer. */
  .note { width: 100%; margin-top: .4rem; font: inherit; line-height: 1.4; padding: .3rem .4rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; resize: none; overflow-y: auto; height: 2.2rem; flex-shrink: 0; transition: height .15s; }
  .note:focus { height: 12rem; outline: 2px solid var(--accent); outline-offset: -1px; }
  .context { margin-top: .4rem; padding: .4rem .5rem; background: var(--warn); border-radius: 4px; font-size: .85rem; }
  .done { padding: 3rem; text-align: center; }
</style>
</head>
<body>
<header>
  <span class="title">Parser review</span>
  <span id="where" class="muted"></span>
  <span id="progress"></span>
  <span id="saved"></span>
  <span style="flex:1"></span>
  <button id="prev">← previous</button>
  <button id="next">next →</button>
  <span class="muted">keys: 1 2 3 = Marker 0/1/2 · 7 8 9 = PaddleOCR-VL 0/1/2 · ← →</span>
</header>
<main id="main"></main>
<script src="katex/katex.min.js"></script>
<script>
// One page at a time. Every score is saved to the server (and so to a file in
// the repo) as soon as it is given. See review_server.py for blind and
// reconcile modes; in blind mode no proposal ever reaches this page.
// Scores: 0 scrambled, 1 partially intact, 2 faithful (EVALUATION.md §1).
const PARSERS = ["marker", "paddle"];
const LABELS = { marker: "Marker", paddle: "PaddleOCR-VL" };
let state;  // from /api/state
let index = 0;

const key = (item, parser) => `${item.excerpt}/${item.page}/${parser}`;
// A pane needs a score in blind mode; in reconcile mode only where the blind
// score and Claude's proposal differ.
const needsScore = (item, parser) => state.mode === "blind" || key(item, parser) in state.proposals;
const complete = (item) => PARSERS.every((p) => !needsScore(item, p) || state.scores[key(item, p)] !== undefined);

function element(tag, props = {}, children = []) {
  const el = Object.assign(document.createElement(tag), props);
  el.append(...children);
  return el;
}

function status(text, cls) {
  const el = document.getElementById("saved");
  el.textContent = text;
  el.className = cls ?? "";
}

async function save(item, parser, score, note) {
  const k = key(item, parser);
  status("saving…");
  try {
    const response = await fetch("api/score", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ excerpt: item.excerpt, page: item.page, parser, score, note }),
    });
    if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
    state.scores[k] = await response.json();
    status("saved", "ok");
    return true;
  } catch (err) {
    status(`not saved: ${err.message}`, "bad");
    return false;
  }
}

function renderMath(root) {
  for (const el of root.querySelectorAll(".math")) {
    katex.render(el.textContent, el, { displayMode: el.classList.contains("block"), throwOnError: false });
  }
}

function parserPane(item, parser) {
  const k = key(item, parser);
  const blocks = item.parsers[parser].map((b) => {
    const body = element("div");
    body.innerHTML = b.html;  // parse_eval.block_html: rendered Markdown (raw HTML escaped), math, <pre> text, or the parser's table HTML
    return element("div", { className: "block" }, [element("div", { className: "kind", textContent: b.kind }), body]);
  });
  const note = element("textarea", { className: "note", placeholder: "note (optional)", value: state.scores[k]?.note ?? "" });
  const buttons = [0, 1, 2].map((n) => element("button", { textContent: String(n) }));
  const paint = () => buttons.forEach((b, n) => b.classList.toggle("on", state.scores[k]?.score === n));
  buttons.forEach((b, n) => { b.onclick = () => choose(item, parser, n, note.value, paint); });
  note.onchange = () => { const s = state.scores[k]; if (s) save(item, parser, s.score, note.value); };
  paint();
  const children = [
    element("h3", { textContent: LABELS[parser] }),
    element("div", { className: "scroll" }, blocks.length ? blocks : [element("em", { textContent: "no blocks on this page" })]),
    element("div", { className: "score" }, [element("span", { textContent: "score" }), ...buttons]),
    note,
  ];
  if (state.mode === "reconcile") {
    const yours = state.blind[k];
    const claude = state.proposals[k];
    children.push(element("div", {
      className: "context",
      textContent: claude
        ? `Your blind score: ${yours?.score ?? "—"}${yours?.note ? ` (${yours.note})` : ""}. Claude: ${claude.score}, ${claude.note}`
        : yours === undefined
          ? "Not scored in the blind pass; nothing to reconcile."
          : `You and Claude agreed: ${yours.score}. Nothing to reconcile.`,
    }));
  }
  const pane = element("div", { className: "pane" }, children);
  pane.dataset.parser = parser;
  pane.paint = paint;
  pane.note = note;
  return pane;
}

async function choose(item, parser, score, note, paint) {
  if (!(await save(item, parser, score, note))) return;
  paint();
  updateProgress();
  if (complete(item)) {
    const next = state.items.findIndex((it, i) => i > index && !complete(it));
    const first = state.items.findIndex((it) => !complete(it));
    if (next !== -1) setTimeout(() => show(next), 350);
    else if (first !== -1) setTimeout(() => show(first), 350);
    else if (state.mode === "blind") {
      status("blind pass complete: loading the disagreements…", "ok");
      setTimeout(() => location.reload(), 1200);
    } else status("all disagreements settled: run make parse-report", "ok");
  }
}

function updateProgress() {
  const done = state.items.filter(complete).length;
  const label = state.mode === "blind" ? "Blind pass" : "Reconciling disagreements";
  document.getElementById("progress").textContent = `${label}: ${done} / ${state.items.length} pages done`;
}

function show(i) {
  index = Math.max(0, Math.min(state.items.length - 1, i));
  const item = state.items[index];
  document.getElementById("where").textContent =
    `${item.excerpt} · PDF page ${item.source_page} · ${item.stresses} · (${index + 1} of ${state.items.length})`;
  const main = document.getElementById("main");
  main.replaceChildren(
    element("div", { className: "pane" }, [
      element("h3", { textContent: "Page" }),
      element("div", { className: "scroll" }, [element("img", { src: item.image, alt: `page ${item.source_page}` })]),
    ]),
    ...PARSERS.map((p) => parserPane(item, p)),
  );
  renderMath(main);
  updateProgress();
}

document.getElementById("prev").onclick = () => show(index - 1);
document.getElementById("next").onclick = () => show(index + 1);
document.addEventListener("keydown", (e) => {
  if (e.target instanceof HTMLTextAreaElement) return;  // typing a note
  const scores = { "1": ["marker", 0], "2": ["marker", 1], "3": ["marker", 2], "7": ["paddle", 0], "8": ["paddle", 1], "9": ["paddle", 2] };
  if (e.key === "ArrowLeft") show(index - 1);
  else if (e.key === "ArrowRight") show(index + 1);
  else if (scores[e.key]) {
    const [parser, score] = scores[e.key];
    const pane = document.querySelector(`.pane[data-parser="${parser}"]`);
    choose(state.items[index], parser, score, pane.note.value, pane.paint);
  }
});

(async () => {
  try {
    state = await (await fetch("api/state")).json();
  } catch (err) {
    document.getElementById("main").replaceChildren(element("p", { className: "done", textContent: `Cannot reach the review server: ${err.message}` }));
    return;
  }
  if (state.items.length === 0) {
    document.getElementById("main").replaceChildren(element("p", { className: "done", textContent: "Nothing left to review. Run make parse-report." }));
    return;
  }
  const first = state.items.findIndex((it) => !complete(it));
  show(first === -1 ? 0 : first);
})();
</script>
</body>
</html>
