<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parser review</title>
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  :root { --fg: #1b1f24; --muted: #5b6470; --bg: #fff; --line: #d8dde3; --accent: #2458c6; --pick: #e8efff; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e6e8eb; --muted: #9aa3ad; --bg: #15181c; --line: #2c3238; --accent: #7aa5ff; --pick: #1d2a44; }
  }
  body { font: 14px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: .6rem 1rem; display: flex; gap: 1rem; align-items: center; z-index: 1; }
  header .keys { color: var(--muted); font-size: .85rem; }
  button { font: inherit; padding: .25rem .7rem; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); cursor: pointer; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .item { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; padding: 1rem; border-bottom: 1px solid var(--line); }
  .item.current { background: var(--pick); }
  .item img { width: 100%; border: 1px solid var(--line); }
  .col h3 { font-size: .9rem; margin: 0 0 .4rem; }
  .blocks { max-height: 70vh; overflow: auto; border: 1px solid var(--line); padding: .5rem; }
  .block { border-left: 3px solid var(--line); padding-left: .5rem; margin: .4rem 0; }
  .kind { color: var(--muted); font-size: .75rem; text-transform: uppercase; }
  pre { white-space: pre-wrap; margin: 0; }
  .score { display: flex; gap: .3rem; align-items: center; margin-top: .5rem; }
  .note { width: 100%; margin-top: .3rem; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); }
  .proposal { color: var(--muted); font-size: .8rem; margin-top: .3rem; }
</style>
</head>
<body>
<header>
  <strong>Parser review</strong>
  <span id="progress"></span>
  <button id="export">Export parse-scores.csv</button>
  <span class="keys">j/k next/previous · 1 2 3 Marker score 0/1/2 · 7 8 9 PaddleOCR-VL score 0/1/2</span>
</header>
<main id="items"></main>
<script src="katex/katex.min.js"></script>
<script src="review-data.js"></script>
<script>
// Scores 0/1/2 per page and parser: 0 scrambled, 1 partially intact, 2 faithful
// (EVALUATION.md §1). Proposals come from proposed-scores.json; your choices
// are kept in this browser's local storage until exported.
const PARSERS = ["marker", "paddle"];
const LABELS = { marker: "Marker", paddle: "PaddleOCR-VL" };
const STORE = "cryptoindex-parse-review";
const { items, proposals } = window.REVIEW;
let saved = {};
try { saved = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch { saved = {}; }
let current = 0;

const key = (item, parser) => `${item.excerpt}/${item.page}/${parser}`;
const proposal = (item, parser) => proposals[key(item, parser)];
const scoreOf = (item, parser) => saved[key(item, parser)] ?? proposal(item, parser);

function persist() {
  try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch { /* private window */ }
  const done = items.filter((i) => PARSERS.every((p) => scoreOf(i, p)?.score !== undefined)).length;
  document.getElementById("progress").textContent = `${done} / ${items.length} pages scored`;
}

function element(tag, props = {}, children = []) {
  const el = Object.assign(document.createElement(tag), props);
  el.append(...children);
  return el;
}

function renderMath(root) {
  for (const el of root.querySelectorAll(".math")) {
    katex.render(el.textContent, el, { displayMode: el.classList.contains("block"), throwOnError: false });
  }
}

function column(item, parser, index) {
  const blocks = item.parsers[parser].map((b) => {
    const body = element("div");
    body.innerHTML = b.html;  // generated by parse_eval.block_html: escaped Markdown, math, or the parser's table HTML
    return element("div", { className: "block" }, [element("div", { className: "kind", textContent: b.kind }), body]);
  });
  const buttons = [0, 1, 2].map((n) => element("button", { textContent: String(n), onclick: () => setScore(index, parser, n) }));
  const note = element("input", { className: "note", placeholder: "note", value: scoreOf(item, parser)?.note ?? "" });
  note.onchange = () => { saved[key(item, parser)] = { ...(scoreOf(item, parser) ?? {}), note: note.value }; persist(); };
  const p = proposal(item, parser);
  const col = element("div", { className: "col" }, [
    element("h3", { textContent: LABELS[parser] }),
    element("div", { className: "blocks" }, blocks.length ? blocks : [element("em", { textContent: "no blocks on this page" })]),
    element("div", { className: "score" }, [element("span", { textContent: "score" }), ...buttons]),
    note,
    element("div", { className: "proposal", textContent: p ? `proposed ${p.score}: ${p.note ?? ""}` : "no proposal" }),
  ]);
  col.dataset.parser = parser;
  return col;
}

function paint(index) {
  const item = items[index];
  const row = document.getElementById(`item-${index}`);
  for (const col of row.querySelectorAll(".col")) {
    const chosen = scoreOf(item, col.dataset.parser)?.score;
    col.querySelectorAll(".score button").forEach((b, n) => b.classList.toggle("on", n === chosen));
  }
}

function setScore(index, parser, score) {
  const item = items[index];
  saved[key(item, parser)] = { ...(scoreOf(item, parser) ?? {}), score };
  paint(index);
  persist();
}

function focus(index) {
  document.getElementById(`item-${current}`)?.classList.remove("current");
  current = Math.max(0, Math.min(items.length - 1, index));
  const row = document.getElementById(`item-${current}`);
  row.classList.add("current");
  row.scrollIntoView({ block: "start" });
}

const main = document.getElementById("items");
items.forEach((item, index) => {
  const title = `${item.excerpt} · PDF page ${item.source_page} · ${item.stresses}`;
  const row = element("section", { className: "item", id: `item-${index}` }, [
    element("div", {}, [element("h3", { textContent: title }), element("img", { src: item.image, alt: title, loading: "lazy" })]),
    ...PARSERS.map((p) => column(item, p, index)),
  ]);
  row.onclick = () => { if (current !== index) focus(index); };
  main.append(row);
  renderMath(row);
  paint(index);
});
persist();
focus(0);

document.addEventListener("keydown", (e) => {
  if (e.target instanceof HTMLInputElement) return;
  const scores = { "1": ["marker", 0], "2": ["marker", 1], "3": ["marker", 2], "7": ["paddle", 0], "8": ["paddle", 1], "9": ["paddle", 2] };
  if (e.key === "j") focus(current + 1);
  else if (e.key === "k") focus(current - 1);
  else if (scores[e.key]) setScore(current, ...scores[e.key]);
});

function csvField(value) {
  const text = value === undefined || value === null ? "" : String(value);
  const quote = [",", '"', "\n"].some((c) => text.includes(c));  // RFC 4180
  return quote ? `"${text.replaceAll('"', '""')}"` : text;
}

document.getElementById("export").onclick = () => {
  const header = ["excerpt", "pdf_page", "parser", "score", "note", "proposed_score", "changed"];
  const rows = [];
  for (const item of items) {
    for (const parser of PARSERS) {
      const s = scoreOf(item, parser);
      if (s?.score === undefined) continue;
      const p = proposal(item, parser);
      rows.push([item.excerpt, item.source_page, parser, s.score, s.note, p?.score, p ? String(p.score !== s.score) : ""]);
    }
  }
  const csv = [header, ...rows].map((r) => r.map(csvField).join(",")).join("\n") + "\n";
  const link = element("a", { href: URL.createObjectURL(new Blob([csv], { type: "text/csv" })), download: "parse-scores.csv" });
  link.click();
  URL.revokeObjectURL(link.href);
};
</script>
</body>
</html>
