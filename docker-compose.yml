services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CI_PG_ADMIN_PASSWORD:?set CI_PG_ADMIN_PASSWORD in .env}
      POSTGRES_DB: cryptoindex
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data in a versioned subdirectory of this path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cryptoindex"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
